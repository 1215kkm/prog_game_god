<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0a0a1a">
    <meta name="description" content="신의 손길 - 디지털 수족관 관상 모드">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <link rel="manifest" href="manifest.json">
    <title>신의 손길 - 관상 모드</title>
    <link rel="stylesheet" href="style.css">
    <style>
        /* Hide cursor after 3 seconds of inactivity */
        body.hide-cursor, body.hide-cursor * { cursor: none !important; }
    </style>
</head>
<body>
    <div id="game-container">
        <canvas id="game-canvas"></canvas>
        <div id="hud" style="display:none">
            <div id="hud-top">
                <div id="world-info">
                    <span id="time-indicator">
                        <span id="time-icon">☀️</span>
                        <span id="time-label">낮</span>
                    </span>
                    <span id="year-display">1년</span>
                    <span id="population-display">인구: 0</span>
                    <span id="era-display">시대: 원시</span>
                    <span id="happiness-display">행복도: 50%</span>
                    <span id="food-display">식량: 50</span>
                    <span id="resource-display">🪵0 🪨0</span>
                </div>
                <div id="speed-controls">
                    <button id="btn-pause" title="일시정지">⏸</button>
                    <button id="btn-speed1" title="1배속" class="active">▶</button>
                    <button id="btn-speed2" title="2배속">▶▶</button>
                    <button id="btn-speed3" title="5배속">▶▶▶</button>
                    <button id="btn-sound" title="소리 켜기/끄기">🔊</button>
                    <button id="btn-ambient" title="관상 모드 (A)">🖥️</button>
                    <button id="btn-fullscreen" title="전체화면 (F)">⛶</button>
                </div>
            </div>
            <div id="god-powers">
                <h3>신의 권능</h3>
                <div id="power-buttons">
                    <button class="power-btn" data-power="sun" title="맑은 날씨">☀️ 맑음</button>
                    <button class="power-btn" data-power="rain" title="비">🌧️ 비</button>
                    <button class="power-btn" data-power="storm" title="폭풍">⛈️ 폭풍</button>
                    <button class="power-btn" data-power="lightning" title="천둥번개">⚡ 번개</button>
                    <button class="power-btn" data-power="wind" title="바람">💨 바람</button>
                    <button class="power-btn" data-power="snow" title="눈">❄️ 눈</button>
                    <button class="power-btn" data-power="earthquake" title="지진">🌋 지진</button>
                    <button class="power-btn" data-power="bless" title="축복">✨ 축복</button>
                    <button class="power-btn" data-power="plague" title="역병">☠️ 역병</button>
                    <button class="power-btn" data-power="miracle" title="기적">🌟 기적</button>
                </div>
            </div>
            <div id="info-panel" class="hidden">
                <button id="close-info">✕</button>
                <div id="info-content"></div>
            </div>
        </div>
        <div id="minimap-container" style="display:none">
            <canvas id="minimap-canvas" width="180" height="180"></canvas>
        </div>
        <div id="weather-overlay"></div>
        <div id="notification-area"></div>
    </div>

    <script type="module">
        // Ambient mode auto-start - no click needed
        // Designed for kiosk displays, floor monitors, digital aquariums
        import { Game } from './src/core/game.js';

        function startAmbient() {
            const canvas = document.getElementById('game-canvas');
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;

            const game = new Game(canvas);
            game.sound.init();
            game.init();

            // Immediately enter ambient mode
            game.ambientMode.toggle();

            // Auto-play BGM if available
            if (game.sound.bgm) {
                game.sound.bgm.start();
            }

            window.game = game;

            // Auto-hide cursor
            let cursorTimer;
            const hideCursor = () => {
                document.body.classList.add('hide-cursor');
            };
            const showCursor = () => {
                document.body.classList.remove('hide-cursor');
                clearTimeout(cursorTimer);
                cursorTimer = setTimeout(hideCursor, 3000);
            };
            document.addEventListener('mousemove', showCursor);
            hideCursor();

            // Double-click to exit ambient mode (for debugging/control)
            let lastClick = 0;
            canvas.addEventListener('click', () => {
                const now = Date.now();
                if (now - lastClick < 400) {
                    // Double-click: toggle game mode
                    game.ambientMode.toggle();
                    document.getElementById('hud').style.display = game.ambientMode.active ? 'none' : '';
                    document.getElementById('minimap-container').style.display = game.ambientMode.active ? 'none' : '';
                }
                lastClick = now;
            });

            // Auto-fullscreen on first interaction
            canvas.addEventListener('click', () => {
                if (!document.fullscreenElement) {
                    document.documentElement.requestFullscreen().catch(() => {});
                }
            }, { once: true });

            // Error recovery: reload on crash
            window.addEventListener('error', () => {
                setTimeout(() => location.reload(), 5000);
            });
            window.addEventListener('unhandledrejection', () => {
                setTimeout(() => location.reload(), 5000);
            });
        }

        // Auto-start with AudioContext workaround
        // Browsers require user gesture for audio, so we start silent
        // and enable audio on first interaction
        window.addEventListener('DOMContentLoaded', () => {
            startAmbient();

            // Enable audio on first interaction
            const enableAudio = () => {
                if (window.game && window.game.sound) {
                    window.game.sound.init();
                    window.game.sound.resume();
                    if (window.game.sound.startBGM) {
                        window.game.sound.startBGM();
                    }
                }
                document.removeEventListener('click', enableAudio);
                document.removeEventListener('keydown', enableAudio);
                document.removeEventListener('touchstart', enableAudio);
            };
            document.addEventListener('click', enableAudio);
            document.addEventListener('keydown', enableAudio);
            document.addEventListener('touchstart', enableAudio);
        });
    </script>
</body>
</html>
