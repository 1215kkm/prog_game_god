<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>Icon Generator</title></head>
<body>
<p>Right-click each canvas and "Save image as" to create icons.</p>
<h3>192x192</h3>
<canvas id="icon192" width="192" height="192"></canvas>
<h3>512x512</h3>
<canvas id="icon512" width="512" height="512"></canvas>
<script>
function drawIcon(canvas) {
    const ctx = canvas.getContext('2d');
    const s = canvas.width;

    // Background
    ctx.fillStyle = '#0a0a2a';
    ctx.fillRect(0, 0, s, s);

    // Glow
    const grd = ctx.createRadialGradient(s/2, s/2, s*0.05, s/2, s/2, s*0.45);
    grd.addColorStop(0, 'rgba(255,215,0,0.3)');
    grd.addColorStop(1, 'rgba(255,215,0,0)');
    ctx.fillStyle = grd;
    ctx.fillRect(0, 0, s, s);

    // Eye of god (stylized)
    ctx.strokeStyle = '#ffd700';
    ctx.lineWidth = s * 0.02;

    // Outer eye shape
    ctx.beginPath();
    ctx.moveTo(s*0.15, s*0.5);
    ctx.quadraticCurveTo(s*0.5, s*0.2, s*0.85, s*0.5);
    ctx.quadraticCurveTo(s*0.5, s*0.8, s*0.15, s*0.5);
    ctx.stroke();

    // Iris
    ctx.fillStyle = '#ffd700';
    ctx.beginPath();
    ctx.arc(s*0.5, s*0.5, s*0.15, 0, Math.PI*2);
    ctx.fill();

    // Pupil
    ctx.fillStyle = '#0a0a2a';
    ctx.beginPath();
    ctx.arc(s*0.5, s*0.5, s*0.07, 0, Math.PI*2);
    ctx.fill();

    // Light reflection
    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.arc(s*0.46, s*0.46, s*0.025, 0, Math.PI*2);
    ctx.fill();

    // Rays
    ctx.strokeStyle = 'rgba(255,215,0,0.3)';
    ctx.lineWidth = s * 0.005;
    for (let i = 0; i < 12; i++) {
        const angle = (i / 12) * Math.PI * 2;
        ctx.beginPath();
        ctx.moveTo(s*0.5 + Math.cos(angle)*s*0.22, s*0.5 + Math.sin(angle)*s*0.22);
        ctx.lineTo(s*0.5 + Math.cos(angle)*s*0.4, s*0.5 + Math.sin(angle)*s*0.4);
        ctx.stroke();
    }

    // Title text
    ctx.fillStyle = '#ffd700';
    ctx.font = `bold ${s*0.1}px serif`;
    ctx.textAlign = 'center';
    ctx.fillText('신', s*0.5, s*0.95);
}

drawIcon(document.getElementById('icon192'));
drawIcon(document.getElementById('icon512'));
</script>
</body>
</html>
